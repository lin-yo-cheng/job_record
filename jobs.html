<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>job_104 職缺列表</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.2rem; }
  nav { margin-bottom: 16px; }
  nav a { margin-right: 12px; }
  #app { display: none; }
  #status { color: #666; font-size: 0.9rem; margin-top: 8px; }
  .filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin: 16px 0; padding: 12px; background: #f7f7f7; border-radius: 6px; }
  .filters label { display: block; font-size: 0.8rem; color: #555; margin-bottom: 4px; }
  .filters input { padding: 6px; }
  .filters button { padding: 6px 14px; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; }
  td, th { border-bottom: 1px solid #ddd; padding: 6px; text-align: left; font-size: 0.9rem; }
  select { padding: 4px; }
  .count { color: #888; font-size: 0.85rem; margin-top: 8px; }
  .banner { display: none; padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; font-size: 0.9rem; }
  .banner.warn { display: block; background: #fff3cd; color: #664d03; border: 1px solid #ffe69c; }
  .status-checkboxes { display: flex; flex-wrap: wrap; gap: 8px; font-size: 0.85rem; }
  .status-checkboxes label { display: flex; align-items: center; gap: 3px; font-weight: normal; }
</style>
</head>
<body>

<h1>job_104 職缺列表</h1>
<nav><a href="search.html">管理搜尋條件</a></nav>

<div id="login">
  <input id="email" type="email" placeholder="Email" style="display:block;width:100%;box-sizing:border-box;padding:8px;margin:6px 0;">
  <input id="password" type="password" placeholder="密碼" style="display:block;width:100%;box-sizing:border-box;padding:8px;margin:6px 0;">
  <button id="loginBtn">登入</button>
  <div id="status"></div>
</div>

<div id="app">
  <p>已登入：<span id="whoami"></span> <button id="logoutBtn">登出</button></p>

  <div id="scraperBanner" class="banner"></div>

  <div class="filters">
    <div>
      <label>擅長工具／技能（逗號分隔，符合任一即可）</label>
      <input id="filterSkill" placeholder="例如 SQL, Python">
    </div>
    <div>
      <label>最高薪資門檻（大於）</label>
      <input id="filterSalaryMin" type="number" placeholder="例如 40000">
    </div>
    <div>
      <label>最少公司人數（大於，公司規模）</label>
      <input id="filterEmployeeMin" type="number" placeholder="例如 100">
    </div>
    <div>
      <label>排除關鍵字（逗號分隔，職務類別／職缺名稱符合任一即排除）</label>
      <input id="filterExclude" placeholder="例如 業務, 電話行銷">
    </div>
    <div>
      <label>職務類別（逗號分隔，比對職務類別／職缺名稱，符合任一即可）</label>
      <input id="filterCategory" placeholder="例如 工程師, 分析師" list="recentCategoriesList" autocomplete="off">
      <datalist id="recentCategoriesList"></datalist>
    </div>
    <div>
      <label>狀態</label>
      <div id="statusCheckboxes" class="status-checkboxes"></div>
    </div>
    <div>
      <label>排序方式</label>
      <select id="sortBy">
        <option value="">不排序</option>
        <option value="salary_desc">最高薪資（高到低）</option>
        <option value="employee_desc">公司人數（多到少）</option>
        <option value="job_name_asc">職稱（A-Z）</option>
      </select>
    </div>
    <div>
      <button id="applyFilterBtn">套用篩選</button>
    </div>
    <div>
      <button id="clearFilterBtn">清除篩選</button>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>公司名稱</th>
        <th>職缺名稱</th>
        <th>薪資</th>
        <th>擅長工具</th>
        <th>鄉鎮市區</th>
        <th>連結</th>
        <th>狀態</th>
      </tr>
    </thead>
    <tbody id="jobList"></tbody>
  </table>
  <div class="count" id="count"></div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL = 'https://rrvvmrmfzpdmwdqurfpr.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_VCgOkp2h7RjVXnZL1Pm22g_L9P6VXTa';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const STATUS_OPTIONS = ['最新資料', '已投遞', '有面試邀約', '已面試', '放棄', '放棄approve'];
  const STATUS_FILTER_OPTIONS = [
    { value: '最新資料', label: '最新資料', defaultChecked: true },
    { value: '', label: '空（未處理）', defaultChecked: true },
    { value: '已投遞', label: '已投遞', defaultChecked: false },
    { value: '有面試邀約', label: '有面試邀約', defaultChecked: false },
    { value: '已面試', label: '已面試', defaultChecked: false },
    { value: '放棄', label: '放棄', defaultChecked: false },
    { value: '放棄approve', label: '放棄approve', defaultChecked: false },
  ];

  const $ = (id) => document.getElementById(id);

  let allJobs = [];

  $('loginBtn').onclick = async () => {
    $('status').textContent = '登入中...';
    const { data, error } = await supabase.auth.signInWithPassword({
      email: $('email').value,
      password: $('password').value,
    });
    if (error) {
      $('status').textContent = '登入失敗：' + error.message;
      return;
    }
    showApp(data.user.email);
  };

  $('logoutBtn').onclick = async () => {
    await supabase.auth.signOut();
    $('app').style.display = 'none';
    $('login').style.display = 'block';
    $('status').textContent = '';
  };

  $('applyFilterBtn').onclick = async () => {
    await saveCategorySearchTerms();
    await saveFilterState();
    renderJobs();
  };
  $('sortBy').onchange = async () => {
    await saveFilterState();
    renderJobs();
  };
  $('clearFilterBtn').onclick = async () => {
    resetFilterTextInputs();
    document.querySelectorAll('.statusFilterCb').forEach(cb => { cb.checked = false; }); // 清除篩選 = 全部不勾 = 顯示所有狀態
    await saveFilterState();
    renderJobs();
  };

  function resetFilterTextInputs() {
    $('filterSkill').value = '';
    $('filterSalaryMin').value = '';
    $('filterEmployeeMin').value = '';
    $('filterExclude').value = '';
    $('filterCategory').value = '';
    $('sortBy').value = '';
  }

  function renderStatusCheckboxes() {
    $('statusCheckboxes').innerHTML = STATUS_FILTER_OPTIONS.map(opt => `
      <label>
        <input type="checkbox" class="statusFilterCb" value="${opt.value}" ${opt.defaultChecked ? 'checked' : ''}>
        ${opt.label}
      </label>
    `).join('');
    document.querySelectorAll('.statusFilterCb').forEach(cb => {
      cb.onchange = async () => {
        await saveFilterState();
        renderJobs();
      };
    });
  }

  function getCheckedStatuses() {
    return [...document.querySelectorAll('.statusFilterCb:checked')].map(cb => cb.value);
  }

  // 把目前畫面上的篩選條件存進資料庫，跟著帳號走（不同帳號各自獨立，靠 RLS 隔離）
  async function saveFilterState() {
    const row = {
      skill: $('filterSkill').value,
      salary_min: $('filterSalaryMin').value === '' ? null : Number($('filterSalaryMin').value),
      employee_min: $('filterEmployeeMin').value === '' ? null : Number($('filterEmployeeMin').value),
      exclude_terms: $('filterExclude').value,
      category: $('filterCategory').value,
      sort_by: $('sortBy').value,
      statuses: getCheckedStatuses(),
      updated_at: new Date().toISOString(),
    };
    await supabase.from('user_filters').upsert(row, { onConflict: 'user_id' });
  }

  // 登入時還原這個帳號自己上次存的篩選條件；沒存過就維持 renderStatusCheckboxes() 給的預設值
  async function loadFilterState() {
    const { data, error } = await supabase.from('user_filters').select('*').maybeSingle();
    if (error || !data) return;
    $('filterSkill').value = data.skill || '';
    $('filterSalaryMin').value = data.salary_min ?? '';
    $('filterEmployeeMin').value = data.employee_min ?? '';
    $('filterExclude').value = data.exclude_terms || '';
    $('filterCategory').value = data.category || '';
    $('sortBy').value = data.sort_by || '';
    const savedStatuses = data.statuses || [];
    document.querySelectorAll('.statusFilterCb').forEach(cb => {
      cb.checked = savedStatuses.includes(cb.value);
    });
  }

  async function saveCategorySearchTerms() {
    const terms = $('filterCategory').value.split(',').map(s => s.trim()).filter(Boolean);
    if (!terms.length) return;
    const rows = terms.map(term => ({ term, searched_at: new Date().toISOString() }));
    await supabase.from('job_category_search_history').upsert(rows, { onConflict: 'user_id,term' });
    loadRecentCategories();
  }

  async function loadRecentCategories() {
    const { data, error } = await supabase
      .from('job_category_search_history')
      .select('term')
      .order('searched_at', { ascending: false })
      .limit(5);
    if (error || !data) return;
    $('recentCategoriesList').innerHTML = data.map(r => `<option value="${r.term}">`).join('');
  }

  function parseEmployeeCount(val) {
    const m = String(val || '').match(/\d+/);
    return m ? parseInt(m[0], 10) : null;
  }

  function formatSalary(j) {
    const min = j.salary_min, max = j.salary_max;
    if (!min && !max) return '面議';
    if (min && max && min !== max) return `${min.toLocaleString()} ~ ${max.toLocaleString()}`;
    return (max || min).toLocaleString();
  }

  async function showApp(email) {
    $('login').style.display = 'none';
    $('app').style.display = 'block';
    $('whoami').textContent = email;
    renderStatusCheckboxes();  // 先渲染成預設勾選狀態，若這個帳號有存過篩選條件，下面會覆蓋成他自己存的
    await loadFilterState();   // 還原這個帳號自己上次存的篩選條件（沒存過就維持預設）
    loadRecentCategories();
    loadJobs();
    checkScraperStatus();
  }

  async function checkScraperStatus() {
    const { data, error } = await supabase
      .from('scraper_status')
      .select('*')
      .eq('id', 1)
      .maybeSingle();
    if (error || !data) return;

    const banner = $('scraperBanner');
    if (!data.last_success) {
      const when = data.last_run_at ? new Date(data.last_run_at).toLocaleString() : '未知時間';
      banner.textContent = `⚠️ 資料可能不是最新的：最近一次排程於 ${when} 失敗（${data.last_error || '原因未知'}），請通知管理者更新`;
      banner.classList.add('warn');
    } else {
      banner.classList.remove('warn');
      banner.textContent = '';
    }
  }

  async function loadJobs() {
    // 只會拿到「自己的搜尋條件」命中的職缺，因為 search_job_matches 的 RLS 是透過 saved_searches.user_id 過濾的
    const { data: matches, error } = await supabase
      .from('search_job_matches')
      .select('job_id, jobs(*)');
    if (error) {
      alert('讀取職缺失敗：' + error.message);
      return;
    }

    const jobMap = new Map();
    for (const m of matches) {
      if (m.jobs) jobMap.set(m.job_id, m.jobs);
    }
    const jobIds = [...jobMap.keys()];

    let statusMap = new Map();
    if (jobIds.length) {
      const { data: statuses, error: statusErr } = await supabase
        .from('job_status')
        .select('job_id, status')
        .in('job_id', jobIds);
      if (statusErr) {
        alert('讀取狀態失敗：' + statusErr.message);
        return;
      }
      statusMap = new Map(statuses.map(s => [s.job_id, s.status]));
    }

    allJobs = jobIds.map(id => ({ ...jobMap.get(id), status: statusMap.get(id) || '' }));
    renderJobs();
  }

  function renderJobs() {
    const skillTerms = $('filterSkill').value.split(',').map(s => s.trim()).filter(Boolean);
    const salaryMinRaw = $('filterSalaryMin').value;
    const salaryMin = salaryMinRaw === '' ? null : Number(salaryMinRaw);
    const employeeMinRaw = $('filterEmployeeMin').value;
    const employeeMin = employeeMinRaw === '' ? null : Number(employeeMinRaw);
    const excludeTerms = $('filterExclude').value.split(',').map(s => s.trim()).filter(Boolean);
    const categoryTerms = $('filterCategory').value.split(',').map(s => s.trim()).filter(Boolean);
    const checkedStatuses = getCheckedStatuses();

    const filtered = allJobs.filter(j => {
      if (skillTerms.length) {
        const combined = ((j.skill || '') + ' ' + (j.specialty || '')).toLowerCase();
        const hasAny = skillTerms.some(t => combined.includes(t.toLowerCase()));
        if (!hasAny) return false;
      }
      if (salaryMin !== null) {
        const max = j.salary_max;
        if (!(max > salaryMin || max === 0 || max === null)) return false;
      }
      if (employeeMin !== null) {
        const count = parseEmployeeCount(j.employees);
        // 公司人數欄位無法解析（例如「暫不提供」）就保留，不因為篩不到數字而排除
        if (count !== null && !(count > employeeMin)) return false;
      }
      if (excludeTerms.length) {
        const combined = ((j.job_name || '') + ' ' + (j.job_category || '')).toLowerCase();
        const hasExcluded = excludeTerms.some(t => combined.includes(t.toLowerCase()));
        if (hasExcluded) return false;
      }
      if (categoryTerms.length) {
        const combined = ((j.job_category || '') + ' ' + (j.job_name || '')).toLowerCase();
        const hasAny = categoryTerms.some(t => combined.includes(t.toLowerCase()));
        if (!hasAny) return false;
      }
      if (checkedStatuses.length && !checkedStatuses.includes(j.status || '')) return false;
      return true;
    });

    const sortBy = $('sortBy').value;
    if (sortBy === 'salary_desc') {
      filtered.sort((a, b) => (b.salary_max || 0) - (a.salary_max || 0));
    } else if (sortBy === 'employee_desc') {
      filtered.sort((a, b) => (parseEmployeeCount(b.employees) || -1) - (parseEmployeeCount(a.employees) || -1));
    } else if (sortBy === 'job_name_asc') {
      filtered.sort((a, b) => (a.job_name || '').localeCompare(b.job_name || '', 'zh-Hant'));
    }

    $('jobList').innerHTML = filtered.map(j => `
      <tr>
        <td>${j.cust_name || ''}</td>
        <td>${j.job_name || ''}</td>
        <td>${formatSalary(j)}</td>
        <td>${j.specialty || ''}</td>
        <td>${j.address_region || ''}</td>
        <td><a href="${j.job_url || '#'}" target="_blank">連結</a></td>
        <td>
          <select class="status-select" data-job="${j.job_id}">
            <option value="">（空）</option>
            ${STATUS_OPTIONS.map(s => `<option value="${s}">${s}</option>`).join('')}
          </select>
        </td>
      </tr>
    `).join('');

    filtered.forEach(j => {
      const sel = document.querySelector(`.status-select[data-job="${j.job_id}"]`);
      sel.value = j.status || '';
      sel.onchange = async () => {
        const { error } = await supabase.from('job_status').upsert(
          { job_id: j.job_id, status: sel.value || null, updated_at: new Date().toISOString() },
          { onConflict: 'user_id,job_id' }
        );
        if (error) {
          alert('狀態更新失敗：' + error.message);
          return;
        }
        const cached = allJobs.find(x => x.job_id === j.job_id);
        if (cached) cached.status = sel.value || '';
        renderJobs();
      };
    });

    $('count').textContent = `共 ${filtered.length} 筆（總計 ${allJobs.length} 筆）`;
  }

  supabase.auth.getSession().then(({ data }) => {
    if (data.session) showApp(data.session.user.email);
  });
</script>

</body>
</html>
